# Kestrel config — copy to ~/.config/kestrel/config.toml. Every key is optional.
# Restart Kestrel after editing. Colors come from your Omarchy theme automatically.

[general]
keymap = "standard"            # "standard": normal browser + shortcuts; "vim": modal Vim keys
homepage = "kestrel://start"
search_engine = "ddg"          # key from [search_engines] used for plain searches
restore_session = true         # reopen your tabs on start
show_tabs = "always"           # always | multiple | never
hint_chars = "asdfghjkl"       # letters used for link hints (Alt+F)
scroll_step = 60               # pixels per j/k (vim keymap)
default_zoom = 1.0
force_dark = false             # force dark mode on every site
smooth_scrolling = true
font = "JetBrainsMono Nerd Font"
font_size = 11
downloads_dir = "~/Downloads"

# Type "<key> <query>" in the address bar, e.g. "yt lofi", "aw pacman".
[search_engines]
# ddg = "https://duckduckgo.com/?q={}"
# g   = "https://www.google.com/search?q={}"
mdn = "https://developer.mozilla.org/en-US/search?q={}"
pkg = "https://archlinux.org/packages/?q={}"

# Remap keys. The value is a command; open the palette (Ctrl+K) and type ">"
# to browse them, or see kestrel/commands.py. Use "nop" to unbind a key.
# Notation: "<C-t>" Ctrl+T, "<C-S-t>" Ctrl+Shift+T, "<A-Left>" Alt+Left, "<F5>".
# In the standard keymap only Ctrl/Alt chords and F-keys work as shortcuts,
# so plain letters keep typing into the page.
[bindings]
# "<C-e>" = "tab-search"
# "<C-S-c>" = "yank url"
# "<C-h>" = "nop"
